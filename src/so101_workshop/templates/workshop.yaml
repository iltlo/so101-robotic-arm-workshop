# Workshop flags. The command-line scripts ignore this file.
features:
  connect: true
  estop: true
  teleop: true
  click_and_go: true
  calibration: true
  yolo: true
  instructor: false
# recamera listens for boxes from the camera. local runs ultralytics, which
# needs: uv sync --extra yolo
detector: recamera
detections:
  ws_host: 0.0.0.0
  ws_port: 8765
  mqtt_url: mqtt://192.168.42.1:1883
  mqtt_topic: yolo11n_result
camera_host: 192.168.42.1
camera_profile: camera_recamera.yaml
yolo_model: detection/model/demo.pt
yolo_confidence: 0.25
