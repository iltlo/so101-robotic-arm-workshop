[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-workshop"
version = "0.1.6"
description = "SO-101 workshop: local arm control and a browser UI"
readme = "README.md"
authors = [{ name = "iltlo", email = "pypi@ianlo.net" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.3.2,<3",
    "scipy>=1.14",
    "PyYAML>=6",
    # Headless keeps the default install free of the GUI wheel. The yolo extra
    # pulls opencv-python in with ultralytics.
    "opencv-python-headless>=4.11,<4.14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # uvicorn refuses a browser websocket upgrade unless this is installed.
    # The reCamera detection bridge uses it too.
    "websockets>=13",
    "pyserial>=3.5,<4",
    "feetech-servo-sdk>=1.0.0",
    "paho-mqtt>=2.1",
    "pupil-apriltags>=1.0.4; python_version < '3.14'",
    # 0.27+ publishes no Intel macOS wheel. 0.26.2 still has Intel Mac,
    # Apple silicon, Linux, and Windows wheels.
    "rerun-sdk>=0.26.2,<0.27",
]

[project.scripts]
so101-workshop = "so101_workshop.cli:main"

[project.optional-dependencies]
# Frames from a RealSense. A D405 still uses the intrinsics in its profile.
# Another model reads the colour stream once this is installed.
vision = ["pyrealsense2>=2.55; sys_platform != 'darwin'"]
# Local YOLO. The default detector is the reCamera, which does not need this.
yolo = ["ultralytics>=8.3"]
twin = ["pynput>=1.7.8,<1.9"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
so101_workshop = ["static/*", "templates/*"]

# Ship the pinned arm files so an installed run works without GitHub access.
[tool.setuptools.data-files]
"share/so101-utils/SO101" = [
    "assets/SO101/so101_new_calib.urdf",
    "assets/SO101/LICENSE.upstream",
]
"share/so101-utils/SO101/assets" = ["assets/SO101/assets/*.stl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
# Default keys only watch pyproject.toml and whether src/ exists. Editing a
# file inside src/ does not change that, so `uvx --from .` keeps the old wheel.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.html" },
    { file = "src/**/*.yaml" },
    { file = "assets/**/*.urdf" },
]
