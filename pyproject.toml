[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-workshop"
version = "0.1.3"
description = "SO-101 workshop: local arm control and a browser UI"
readme = "README.md"
authors = [{ name = "iltlo", email = "pypi@ianlo.net" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.3.2,<3",
    "scipy>=1.14",
    "PyYAML>=6",
    "opencv-python-headless>=4.11,<4.14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyserial>=3.5,<4",
    "feetech-servo-sdk>=1.0.0",
    "paho-mqtt>=2.1",
    "pupil-apriltags>=1.0.4; python_version < '3.14'",
    "websockets>=13",
    # 0.27+ publishes no Intel macOS wheel. 0.26.2 still has Intel Mac,
    # Apple silicon, Linux, and Windows wheels.
    "rerun-sdk>=0.26.2,<0.27",
]

[project.scripts]
so101-workshop = "so101_workshop.cli:main"

[project.optional-dependencies]
vision = ["pyrealsense2"]
twin = ["pynput>=1.7.8,<1.9"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
so101_workshop = ["static/*", "templates/*"]

# Ship the pinned arm files so an installed run works without GitHub access.
[tool.setuptools.data-files]
"share/so101-utils/SO101" = [
    "assets/SO101/so101_new_calib.urdf",
    "assets/SO101/LICENSE.upstream",
]
"share/so101-utils/SO101/assets" = ["assets/SO101/assets/*.stl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
